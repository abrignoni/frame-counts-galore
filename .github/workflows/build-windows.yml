name: Build Windows executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build command line executable
        run: >
          pyinstaller --noconfirm --clean --onefile --console
          --name video_processor_cli --collect-all av
          video_processor_cli.py

      - name: Build graphical executable
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name video_processor_gui --collect-all av
          --hidden-import video_processor_cli
          video_processor_gui.py

      - name: Generate a test video with a known frame count
        shell: python
        run: |
          import av, numpy as np
          frames = 60
          container = av.open("smoke.mp4", "w")
          stream = container.add_stream("libx264", rate=30)
          stream.width, stream.height, stream.pix_fmt = 320, 240, "yuv420p"
          stream.options = {"bf": "3", "g": "15"}
          for i in range(frames):
              img = np.zeros((240, 320, 3), dtype=np.uint8)
              img[:, : (i * 5) % 320] = (i * 4 % 256, 128, 255 - i * 4 % 256)
              for packet in stream.encode(av.VideoFrame.from_ndarray(img, format="rgb24")):
                  container.mux(packet)
          for packet in stream.encode():
              container.mux(packet)
          container.close()
          print("wrote smoke.mp4 with", frames, "frames")

      - name: Smoke test the command line executable
        shell: python
        run: |
          import glob, json, subprocess, csv
          r = subprocess.run([r"dist\video_processor_cli.exe", "-i", "smoke.mp4", "-o", "smoke_out", "--estimate"],
                             capture_output=True, text=True)
          print(r.stdout[-3000:]); print(r.stderr[-3000:])
          assert r.returncode == 0, "exe exited non-zero"
          manifest = json.load(open(glob.glob("smoke_out/case_*/case_provenance_manifest.json")[0]))
          videos = manifest["videos_processed"]
          assert len(videos) == 1, videos
          assert videos[0]["frames"] == 60, videos[0]
          rows = list(csv.DictReader(open(videos[0]["frames_csv"])))
          assert len(rows) == 60 and all(r["hash_verified"] == "True" for r in rows)
          assert len(glob.glob("smoke_out/case_*/smoke/frames/*.png")) == 60
          print("smoke test passed:", videos[0]["frames"], "frames, manifest status", manifest["status"])

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: frame-counts-galore-windows-x64
          path: |
            dist/video_processor_cli.exe
            dist/video_processor_gui.exe
          if-no-files-found: error
